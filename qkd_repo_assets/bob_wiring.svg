<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1210px" version="1.1" viewBox="0 0 1680 1210" width="1680px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#0b1220" height="1210" width="1680" x="0" y="0" /><rect fill="#58c4ff" height="10" width="1680" x="0" y="0" /><text fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" x="70" y="65">Bob wiring | receiver electronics</text><text fill="#aabbd1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" x="70" y="99">Explicit I²C, analog detector, HWP servo and 4×4 keypad connections</text><rect fill="#0b1220" height="1007" rx="16" ry="16" stroke="#2b3c55" stroke-width="2" width="1584" x="48" y="130" /><text fill="#aabbd1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" x="70" y="1179">DIY QKD • BB84-inspired classical-light demonstrator  |  See pin tables and revision notes in README</text><rect fill="#16273c" height="762" rx="12" ry="12" stroke="#5ee1ac" stroke-width="2" width="475" x="74" y="208" /><text fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" x="104" y="257">ESP32-S3 · BOB</text><text fill="#aabbd1" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" x="104" y="288">Logic and ADC supplied at 3.3 V</text><rect fill="#102035" height="55" rx="7" ry="7" stroke="#2b3c55" stroke-width="1" width="410" x="103" y="313" /><text fill="#58c4ff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" x="118" y="343">GPIO17</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" x="295" y="343">I²C SDA</text><circle cx="549" cy="341" fill="#58c4ff" r="5" /><rect fill="#102035" height="55" rx="7" ry="7" stroke="#2b3c55" stroke-width="1" width="410" x="103" y="379" /><text fill="#58c4ff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" x="118" y="409">GPIO20</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" x="295" y="409">I²C SCL</text><circle cx="549" cy="407" fill="#58c4ff" r="5" /><rect fill="#102035" height="55" rx="7" ry="7" stroke="#2b3c55" stroke-width="1" width="410" x="103" y="497" /><text fill="#c4a4ff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" x="118" y="527">GPIO19</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" x="295" y="527">HWP servo PWM</text><circle cx="549" cy="525" fill="#c4a4ff" r="5" /><rect fill="#102035" height="55" rx="7" ry="7" stroke="#2b3c55" stroke-width="1" width="410" x="103" y="653" /><text fill="#fbbf6b" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" x="118" y="683">GPIO11/12/13/14</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" x="295" y="683">Keypad R1 / R2 / R3 / R4</text><circle cx="549" cy="681" fill="#fbbf6b" r="5" /><rect fill="#102035" height="55" rx="7" ry="7" stroke="#2b3c55" stroke-width="1" width="410" x="103" y="721" /><text fill="#fbbf6b" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" x="118" y="751">GPIO18/8/9/10</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" x="295" y="751">Keypad C1 / C2 / C3 / C4</text><circle cx="549" cy="749" fill="#fbbf6b" r="5" /><rect fill="#111c2e" height="300" rx="12" ry="12" stroke="#58c4ff" stroke-width="2" width="415" x="805" y="305" /><text fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" x="843" y="351">ADS1115 · 16-bit I²C ADC</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" x="843" y="389">SDA  ← Bob GPIO17</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" x="843" y="429">SCL  ← Bob GPIO20</text><text fill="#5ee1ac" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" x="843" y="469">A0   ← OPT101 sensor 1 OUT</text><text fill="#5ee1ac" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" x="843" y="506">A1   ← OPT101 sensor 2 OUT</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" x="843" y="548">VDD → 3.3 V  |  GND → GND</text><text fill="#aabbd1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" x="843" y="579">I²C address: 0x48</text><polyline fill="none" points="549,341 710,341 710,382 805,382" stroke="#58c4ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" points="549,407 733,407 733,422 805,422" stroke="#58c4ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><text fill="#58c4ff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" x="615" y="328">SDA</text><text fill="#58c4ff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" x="735" y="397">SCL</text><rect fill="#111c2e" height="129" rx="12" ry="12" stroke="#5ee1ac" stroke-width="2" width="328" x="1270" y="306" /><text fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" x="1297" y="344">OPT101 · detector 1</text><text fill="#5ee1ac" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" x="1297" y="378">OUT → ADS1115 A0</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" x="1297" y="410">V+ 3.3 V* · GND common</text><rect fill="#111c2e" height="129" rx="12" ry="12" stroke="#5ee1ac" stroke-width="2" width="328" x="1270" y="465" /><text fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" x="1297" y="503">OPT101 · detector 2</text><text fill="#5ee1ac" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" x="1297" y="537">OUT → ADS1115 A1</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" x="1297" y="569">V+ 3.3 V* · GND common</text><polyline fill="none" points="1270,367 1246,367 1246,464 1220,464" stroke="#5ee1ac" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" points="1270,526 1243,526 1243,503 1220,503" stroke="#5ee1ac" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#111c2e" height="122" rx="12" ry="12" stroke="#c4a4ff" stroke-width="2" width="415" x="805" y="648" /><text fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="842" y="690">BOB HWP SERVO</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" x="842" y="726">PWM → GPIO19 · V+ 5 V · GND</text><text fill="#aabbd1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" x="842" y="751">Set Bob analyzer + / × basis</text><polyline fill="none" points="549,525 695,525 695,716 805,716" stroke="#c4a4ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#111c2e" height="138" rx="12" ry="12" stroke="#fbbf6b" stroke-width="2" width="793" x="805" y="817" /><text fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" x="842" y="859">4×4 MATRIX KEYPAD (PASSIVE SWITCH GRID)</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" x="842" y="892">Rows R1–R4 → GPIO11, 12, 13, 14</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" x="842" y="922">Columns C1–C4 → GPIO18, 8, 9, 10</text><polyline fill="none" points="549,681 620,681 620,876 805,876" stroke="#fbbf6b" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" points="549,749 654,749 654,914 805,914" stroke="#fbbf6b" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#102637" height="85" rx="12" ry="12" stroke="#345d78" stroke-width="2" width="1524" x="74" y="994" /><text fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" x="104" y="1032">POWER:</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" x="204" y="1032">ADS1115 VDD=3.3 V; sensor supply per your OPT101 module and ADC input limits; servo=stable 5 V.</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" x="104" y="1059">All local GND connections must share Bob ground. No 5 V connection is required for a bare passive keypad.</text><text fill="#fbbf6b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="838" y="1117">*Verify the actual OPT101 breakout pinout/supply rating; analog outputs must remain within the ADS1115 input range.</text></svg>