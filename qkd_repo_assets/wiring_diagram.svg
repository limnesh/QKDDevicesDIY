<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="760px" version="1.1" viewBox="0 0 1680 760" width="1680px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#0b1220" height="760" width="1680" x="0" y="0" /><rect fill="#58c4ff" height="10" width="1680" x="0" y="0" /><text fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" x="70" y="65">System architecture | optical path + classical control</text><text fill="#aabbd1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" x="70" y="99">The two ESP32 units are electrically separate: only free-space light and Wi-Fi connect Alice to Bob.</text><rect fill="#0b1220" height="557" rx="16" ry="16" stroke="#2b3c55" stroke-width="2" width="1584" x="48" y="130" /><text fill="#aabbd1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" x="70" y="729">DIY QKD • BB84-inspired classical-light demonstrator  |  See pin tables and revision notes in README</text><rect fill="#111c2e" height="430" rx="12" ry="12" stroke="#58c4ff" stroke-width="2" width="435" x="80" y="190" /><text fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" x="107" y="240">ALICE / TRANSMITTER</text><rect fill="#16273c" height="178" rx="14" ry="14" stroke="#37668f" stroke-width="2" width="380" x="107" y="273" /><text fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="127" y="307">ESP32-S3</text><polyline fill="none" points="125,322 469,322" stroke="#37668f" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" /><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" x="127" y="354">Laser → GPIO14*</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" x="127" y="381">Alice HWP servo → GPIO18</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" x="127" y="408">Attenuator servo → GPIO17*</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" x="127" y="435">5 V servos · common GND</text><rect fill="#102d42" height="65" rx="12" ry="12" stroke="#58c4ff" stroke-width="2" width="380" x="107" y="515" /><text fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="297" y="554">Laser → polarizer → HWP → film</text><rect fill="#111c2e" height="430" rx="12" ry="12" stroke="#5ee1ac" stroke-width="2" width="435" x="1165" y="190" /><text fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" x="1192" y="240">BOB / RECEIVER</text><rect fill="#16273c" height="178" rx="14" ry="14" stroke="#337968" stroke-width="2" width="380" x="1192" y="273" /><text fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="1212" y="307">ESP32-S3</text><polyline fill="none" points="1210,322 1554,322" stroke="#337968" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" /><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" x="1212" y="354">HWP servo → GPIO19</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" x="1212" y="381">ADS1115 SDA17 / SCL20</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" x="1212" y="408">OPT101 outputs → ADC A0 / A1</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" x="1212" y="435">Keypad rows 11–14 · cols 18,8,9,10</text><rect fill="#103429" height="65" rx="12" ry="12" stroke="#5ee1ac" stroke-width="2" width="380" x="1192" y="515" /><text fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="1382" y="554">HWP → PBS → OPT101 × 2</text><rect fill="#131f31" height="186" rx="12" ry="12" stroke="#2b3c55" stroke-width="2" width="570" x="550" y="270" /><text fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" x="835" y="312">OPTICAL CHANNEL</text><text fill="#aabbd1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle" x="835" y="345">650 nm visible pulses • up to 4.5–5 m tests</text><polyline fill="none" points="535,380 1135,380" stroke="#ff8398" stroke-linecap="round" stroke-linejoin="round" stroke-width="6" /><polygon fill="#ff8398" points="1145,380 1127,369 1127,391" /><text fill="#ff8398" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="835" y="410">No copper / fiber data cable between boards</text><rect fill="#173346" height="84" rx="12" ry="12" stroke="#58c4ff" stroke-width="2" width="450" x="610" y="486" /><text fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="835" y="516">Wi-Fi / TCP control channel</text><text fill="#aabbd1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="835" y="546">Basis disclosure • measurement status • demo checks</text><polyline fill="none" points="500,524 610,524" stroke="#58c4ff" stroke-dasharray="9,8" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><polyline fill="none" points="1060,524 1174,524" stroke="#58c4ff" stroke-dasharray="9,8" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><text fill="#fbbf6b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="840" y="653">*GPIO14/17 shown for earlier physical/calibration build; firmware V2 uses laser GPIO17 and disables GPIO14. Verify before wiring.</text></svg>