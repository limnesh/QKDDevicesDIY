<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1080px" version="1.1" viewBox="0 0 1680 1080" width="1680px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#0b1220" height="1080" width="1680" x="0" y="0" /><rect fill="#58c4ff" height="10" width="1680" x="0" y="0" /><text fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" x="70" y="65">Alice wiring | transmitter electronics</text><text fill="#aabbd1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" x="70" y="99">GPIO-to-component connections • servo PWM signals • laser-driver interface • shared local ground</text><rect fill="#0b1220" height="877" rx="16" ry="16" stroke="#2b3c55" stroke-width="2" width="1584" x="48" y="130" /><text fill="#aabbd1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" x="70" y="1049">DIY QKD • BB84-inspired classical-light demonstrator  |  See pin tables and revision notes in README</text><rect fill="#16273c" height="620" rx="12" ry="12" stroke="#58c4ff" stroke-width="2" width="500" x="80" y="220" /><text fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" x="115" y="275">ESP32-S3 · ALICE</text><text fill="#aabbd1" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" x="115" y="306">Board powered by its USB/regulated input</text><rect fill="#102035" height="99" rx="8" ry="8" stroke="#2b3c55" stroke-width="1" width="432" x="110" y="349" /><text fill="#ff8398" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="129" y="384">GPIO14</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" x="129" y="419">Laser enable / control*</text><circle cx="580" cy="392" fill="#ff8398" r="5" /><rect fill="#102035" height="99" rx="8" ry="8" stroke="#2b3c55" stroke-width="1" width="432" x="110" y="513" /><text fill="#58c4ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="129" y="548">GPIO18</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" x="129" y="583">HWP servo PWM</text><circle cx="580" cy="556" fill="#58c4ff" r="5" /><rect fill="#102035" height="99" rx="8" ry="8" stroke="#2b3c55" stroke-width="1" width="432" x="110" y="676" /><text fill="#c4a4ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="129" y="711">GPIO17</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" x="129" y="746">Attenuator servo PWM*</text><circle cx="580" cy="719" fill="#c4a4ff" r="5" /><rect fill="#111c2e" height="140" rx="12" ry="12" stroke="#ff8398" stroke-width="2" width="278" x="870" y="323" /><text fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="1009" y="361">LASER INTERFACE</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle" x="1009" y="395">Rated driver / switch</text><text fill="#fbbf6b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="1009" y="426">Do not exceed GPIO current</text><rect fill="#111c2e" height="140" rx="12" ry="12" stroke="#ff8398" stroke-width="2" width="300" x="1260" y="323" /><text fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="1410" y="363">650 nm laser module</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="1410" y="401">V+ → rated module supply</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="1410" y="431">Return → driver output</text><polyline fill="none" points="580,392 870,392" stroke="#ff8398" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" points="1148,392 1260,392" stroke="#ff8398" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><text fill="#ff8398" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="712" y="380">GPIO control</text><text fill="#ff8398" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="1203" y="378">switched</text><rect fill="#111c2e" height="137" rx="12" ry="12" stroke="#58c4ff" stroke-width="2" width="690" x="870" y="488" /><text fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="918" y="531">ALICE HWP SERVO</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" x="918" y="565">Signal → GPIO18   |   V+ → external 5 V   |   GND → shared ground</text><text fill="#aabbd1" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" x="918" y="597">Rotates the transmitter half-wave plate</text><polyline fill="none" points="580,556 870,556" stroke="#58c4ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><text fill="#58c4ff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="718" y="542">PWM control</text><rect fill="#111c2e" height="138" rx="12" ry="12" stroke="#c4a4ff" stroke-width="2" width="690" x="870" y="650" /><text fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="918" y="692">ATTENUATOR / DECOY STAGE SERVO</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" x="918" y="725">Signal → GPIO17   |   V+ → external 5 V   |   GND → shared ground</text><text fill="#aabbd1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" x="918" y="755">Optional classical attenuation mechanism; not a true decoy-state transmitter</text><polyline fill="none" points="580,719 870,719" stroke="#c4a4ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><text fill="#c4a4ff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="718" y="705">PWM control</text><rect fill="#102637" height="122" rx="12" ry="12" stroke="#345d78" stroke-width="2" width="1480" x="80" y="865" /><text fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" x="111" y="904">POWER &amp; GROUND</text><text fill="#d8e6f7" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" x="111" y="939">Servos: stable regulated 5 V supply; connect servo GND, driver GND and Alice ESP32 GND together.</text><text fill="#aabbd1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" x="111" y="967">Laser: use the voltage/current specified by the actual module; control through a suitable interface if required.</text><text fill="#fbbf6b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="838" y="1028">*For V2 keypad firmware, Alice laser is GPIO17; GPIO14 is disabled and decoy servo is not driven. Match your build revision.</text></svg>